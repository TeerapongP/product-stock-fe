<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
  <title id="title">โครงสร้างฐานข้อมูล ProductStock</title>
  <desc id="desc">ตาราง products เชื่อมแบบหนึ่งต่อหลายกับตาราง stocks ผ่าน product_code</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="1440" height="790" fill="#101820"/>
  <text x="64" y="75" fill="#f1f5f9" font-size="34" font-weight="700">โครงสร้างฐานข้อมูล</text>
  <text x="64" y="112" fill="#aab8c5" font-size="18">ProductStock · MySQL</text>

  <g transform="translate(80 160)">
    <rect width="500" height="500" rx="16" fill="#1c2a36" stroke="#536475" stroke-width="2"/>
    <path d="M16 0h468a16 16 0 0 1 16 16v68H0V16A16 16 0 0 1 16 0Z" fill="#146c63"/>
    <text x="26" y="42" fill="#fff" font-size="26" font-weight="700">products</text>
    <text x="26" y="68" fill="#c4e6df" font-size="15">ข้อมูลสินค้า</text>
    <g fill="#e5edf5" font-size="17">
      <text class="mono" x="26" y="125">id</text><text x="474" y="125" text-anchor="end" fill="#7dd3fc">PK · BIGINT UNSIGNED</text>
      <text class="mono" x="26" y="178">product_code</text><text x="474" y="178" text-anchor="end" fill="#7dd3fc">UNIQUE · VARCHAR(50)</text>
      <text class="mono" x="26" y="231">product_name</text><text x="474" y="231" text-anchor="end" fill="#aab8c5">VARCHAR(150)</text>
      <text class="mono" x="26" y="284">description</text><text x="474" y="284" text-anchor="end" fill="#aab8c5">VARCHAR(500)</text>
      <text class="mono" x="26" y="337">price</text><text x="474" y="337" text-anchor="end" fill="#aab8c5">DECIMAL(10,2)</text>
      <text class="mono" x="26" y="390">is_active</text><text x="474" y="390" text-anchor="end" fill="#aab8c5">BOOLEAN</text>
      <text class="mono" x="26" y="443">created_at</text><text x="474" y="443" text-anchor="end" fill="#aab8c5">TIMESTAMP</text>
    </g>
    <g stroke="#354654"><path d="M0 144h500M0 197h500M0 250h500M0 303h500M0 356h500M0 409h500"/></g>
  </g>

  <g transform="translate(860 160)">
    <rect width="500" height="500" rx="16" fill="#1c2a36" stroke="#536475" stroke-width="2"/>
    <path d="M16 0h468a16 16 0 0 1 16 16v68H0V16A16 16 0 0 1 16 0Z" fill="#146c63"/>
    <text x="26" y="42" fill="#fff" font-size="26" font-weight="700">stocks</text>
    <text x="26" y="68" fill="#c4e6df" font-size="15">จำนวนสินค้าแยกตามคลัง</text>
    <g fill="#e5edf5" font-size="17">
      <text class="mono" x="26" y="125">id</text><text x="474" y="125" text-anchor="end" fill="#7dd3fc">PK · BIGINT UNSIGNED</text>
      <text class="mono" x="26" y="178">product_code</text><text x="474" y="178" text-anchor="end" fill="#7dd3fc">FK → products.product_code</text>
      <text class="mono" x="26" y="231">warehouse_code</text><text x="474" y="231" text-anchor="end" fill="#aab8c5">VARCHAR(30)</text>
      <text class="mono" x="26" y="284">quantity_on_hand</text><text x="474" y="284" text-anchor="end" fill="#aab8c5">INT UNSIGNED</text>
      <text class="mono" x="26" y="337">quantity_reserved</text><text x="474" y="337" text-anchor="end" fill="#aab8c5">INT UNSIGNED</text>
      <text class="mono" x="26" y="390">updated_at</text><text x="474" y="390" text-anchor="end" fill="#aab8c5">TIMESTAMP</text>
      <text class="mono" x="26" y="443">UNIQUE(product_code, warehouse_code)</text>
    </g>
    <g stroke="#354654"><path d="M0 144h500M0 197h500M0 250h500M0 303h500M0 356h500M0 409h500"/></g>
  </g>

  <path d="M580 330h280" fill="none" stroke="#89d4c2" stroke-width="4"/>
  <text x="600" y="300" fill="#89d4c2" font-size="17" font-weight="600">1 สินค้า</text>
  <text x="800" y="300" fill="#89d4c2" font-size="17" font-weight="600">หลายคลัง</text>
  <path d="m842 318 18 12-18 12" fill="none" stroke="#89d4c2" stroke-width="4"/>

  <text x="80" y="725" fill="#aab8c5" font-size="17">ปริมาณพร้อมขาย = quantity_on_hand − quantity_reserved</text>
</svg>
